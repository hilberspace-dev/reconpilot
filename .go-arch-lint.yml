version: 3
workdir: .

# Architecture boundaries apply to production code; tests may cross layers
# (integration tests bootstrap containers, golden tests drive the full stack).
excludeFiles:
  - "^.*_test\\.go$"

allow:
  depOnAnyVendor: false

vendors:
  pgx: { in: github.com/jackc/pgx/** }

components:
  domain:         { in: internal/domain }
  ingestion:      { in: internal/ingestion }
  matching:       { in: internal/matching }
  classification: { in: internal/classification }
  invariants:     { in: internal/invariants }
  engine:         { in: internal/engine }
  generator:      { in: internal/generator }
  reporting:      { in: internal/reporting }
  store:          { in: internal/store }
  cmd:            { in: cmd/** }

deps:
  ingestion:      { mayDependOn: [domain, store] }  # ingest.go persists via store
  matching:       { mayDependOn: [domain] }
  classification: { mayDependOn: [domain, matching] }
  invariants:     { mayDependOn: [domain, matching, classification] }
  engine:         { mayDependOn: [domain, matching, classification, invariants] }
  generator:      { mayDependOn: [domain] }
  reporting:      { mayDependOn: [domain, engine] }
  store:          { mayDependOn: [domain, matching, classification], canUse: [pgx] }
  cmd:            { mayDependOn: [domain, ingestion, matching, classification, invariants, engine, generator, reporting, store] }
